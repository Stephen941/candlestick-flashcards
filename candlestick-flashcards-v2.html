<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Candlestick Pattern Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10161d;
    --surface:#1a222b;
    --surface-2:#212b35;
    --line:#2a3542;
    --ink:#e9eef3;
    --muted:#8695a7;
    --bull:#2dd4b4;
    --bull-dim:#1d5f56;
    --bear:#f0645f;
    --bear-dim:#6b2f2e;
    --neutral:#d9a441;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(1200px 600px at 50% -10%, #17202a 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:26px 16px 40px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.16em;
    color:var(--muted);
    text-transform:uppercase;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(20px,5vw,28px);
    margin:4px 0 16px;
    letter-spacing:-0.01em;
    text-align:center;
  }

  .controls{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    justify-content:center;
  }
  .filter-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.03em;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--muted);
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .filter-btn.on[data-c="br"], .filter-btn.on[data-c="bc"]{color:var(--bull);border-color:var(--bull-dim);background:#132a26;}
  .filter-btn.on[data-c="er"], .filter-btn.on[data-c="ec"]{color:var(--bear);border-color:var(--bear-dim);background:#2a1615;}

  .action-row{
    display:flex;
    justify-content:center;
    gap:8px;
  }
  .action-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.04em;
    padding:8px 16px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    cursor:pointer;
  }
  .action-btn:active{transform:scale(0.97);}

  .stage{
    width:100%;
    max-width:380px;
    perspective:1400px;
    overflow:visible;
  }
  .slide-wrap{
    width:100%;
    transform-style:preserve-3d;
    will-change:transform;
  }
  .card{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.8,.2,1);
    touch-action:pan-y;
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:18px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--surface) 0%, #161e26 100%);
    display:flex;
    flex-direction:column;
    padding:16px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.6);
  }
  .face.back{transform:rotateY(180deg);}

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
    letter-spacing:0.06em;
    gap:8px;
  }
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.05em;
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  .tag.br, .tag.bc{color:var(--bull);background:#122c27;border:1px solid var(--bull-dim);}
  .tag.er, .tag.ec{color:var(--bear);background:#2c1615;border:1px solid var(--bear-dim);}

  .trend-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    color:#5f6f81;
    letter-spacing:0.04em;
    margin-top:8px;
  }

  .chart{
    position:relative;
    flex:1;
    margin:6px 0 10px;
    border-radius:10px;
    background:
      repeating-linear-gradient(180deg, transparent 0, transparent 24px, var(--line) 24px, var(--line) 25px),
      #131a21;
    overflow:hidden;
  }
  .lead-zone{
    position:absolute;
    left:0; top:0; bottom:0;
    width:28%;
    border-right:1px dashed #2c3946;
  }
  .lead-candle{
    position:absolute;
    bottom:0;
    height:100%;
  }
  .lead-candle .wick{
    position:absolute;
    left:50%;
    width:2px;
    transform:translateX(-50%);
    opacity:0.3;
  }
  .lead-candle .body{
    position:absolute;
    left:50%;
    width:62%;
    transform:translateX(-50%);
    border-radius:2px;
    opacity:0.35;
  }
  .pattern-zone{
    position:absolute;
    left:30%;
    right:0; top:0; bottom:0;
  }
  .candle{
    position:absolute;
    bottom:0;
    width:14%;
    height:100%;
  }
  .wick{
    position:absolute;
    left:50%;
    width:2px;
    transform:translateX(-50%);
    background:var(--muted);
    opacity:0.85;
  }
  .body{
    position:absolute;
    left:50%;
    width:68%;
    transform:translateX(-50%);
    border-radius:2px;
  }
  .body.bull{background:var(--bull);}
  .body.bear{background:var(--bear);}
  .body.neutral{background:var(--neutral);}

  .name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:18px;
    margin:0 0 2px;
    line-height:1.15;
  }
  .hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.05em;
  }
  .desc{
    font-size:13.5px;
    line-height:1.5;
    color:#dbe3ea;
    margin-top:6px;
    overflow-y:auto;
  }
  .face.back .name{font-size:16px;}

  .nav{
    display:flex;
    align-items:center;
    gap:18px;
    margin-top:20px;
  }
  .nav button{
    width:42px;height:42px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .nav button:active{transform:scale(0.94);}
  .counter{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--muted);
    min-width:64px;
    text-align:center;
  }
  .empty-msg{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--muted);
    text-align:center;
    padding:40px 20px;
  }
  .footer-hint{
    margin-top:20px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:#556374;
    text-align:center;
  }

  .score-bar{
    width:100%;
    max-width:380px;
    margin-bottom:16px;
  }
  .score-stats{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
    letter-spacing:0.02em;
  }
  .score-stats .known{color:var(--bull);font-weight:600;}
  .score-stats .review{color:var(--bear);font-weight:600;}
  .progress-track{
    width:100%;
    height:5px;
    border-radius:999px;
    background:var(--surface-2);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--bull),var(--neutral));
    transition:width .3s ease;
    width:0%;
  }
  .status-badge{
    font-size:13px;
    min-width:14px;
    text-align:center;
  }
  .mark-row{
    display:flex;
    gap:12px;
    margin-top:20px;
    width:100%;
    max-width:380px;
  }
  .mark-btn{
    flex:1;
    padding:13px;
    border-radius:14px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
  }
  .mark-btn.no{background:#2a1615;color:var(--bear);border:1px solid var(--bear-dim);}
  .mark-btn.yes{background:#132a26;color:var(--bull);border:1px solid var(--bull-dim);}
  .mark-btn:active{transform:scale(0.96);}
  .review-row{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:12px;
  }
  .action-btn:disabled{
    opacity:0.4;
    cursor:default;
  }
  .action-btn.on{
    background:var(--surface);
    border-color:#4a5666;
  }

  #homeView{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  .home-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    margin-bottom:18px;
  }
  .deck-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:16px;
  }
  .start-btn{
    margin-top:14px;
    padding:14px 28px;
    border-radius:14px;
    border:1px solid var(--bull-dim);
    background:linear-gradient(180deg,#1d5f56 0%,#164a43 100%);
    color:var(--bull);
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .start-btn:active{transform:scale(0.97);}
  .start-btn:disabled{
    opacity:0.35;
    cursor:default;
  }

  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    max-width:380px;
    margin-bottom:14px;
  }
  .back-link{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:6px 2px;
  }

  #studyView{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
</style>
</head>
<body>

  <div id="homeView">
    <div class="eyebrow">Price Action / Flashcards</div>
    <h1>Candlestick Patterns</h1>
    <div class="home-sub">Choose which categories to study</div>

    <div class="controls">
      <div class="filter-row" id="filterRow">
        <button class="filter-btn on" data-c="br">Bullish Reversal</button>
        <button class="filter-btn on" data-c="er">Bearish Reversal</button>
      </div>
      <div class="action-row">
        <button class="action-btn" id="allBtn">Select All</button>
        <button class="action-btn" id="noneBtn">Clear</button>
      </div>
    </div>

    <div class="deck-count" id="deckCount">62 cards selected</div>
    <button class="start-btn" id="startBtn">Start Studying →</button>
  </div>

  <div id="studyView" style="display:none;">
    <div class="top-bar">
      <button class="back-link" id="backBtn">← Categories</button>
      <button class="action-btn" id="shuffleBtn">🔀 Shuffle</button>
    </div>

    <div class="score-bar">
      <div class="score-stats">
        <span><span class="known" id="knownCount">0</span> known · <span class="review" id="reviewCount">0</span> to review</span>
        <span id="remainingCount">0 left</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="stage">
      <div class="slide-wrap" id="slideWrap">
      <div class="card" id="card">
        <div class="face front">
          <div class="card-top">
            <span id="frontIndex">01</span>
            <span class="status-badge" id="frontBadge"></span>
          </div>
          <div class="trend-label" id="frontTrend">PRIOR TREND: DOWN</div>
          <div class="chart" id="chartFront"></div>
          <div class="hint">tap to reveal &middot; swipe for next</div>
        </div>
        <div class="face back">
          <div class="card-top">
            <span id="backIndex">01</span>
            <span class="tag" id="backTag">BULL · REV</span>
          </div>
          <div class="name" id="backName">Hammer</div>
          <div class="desc" id="backDesc">...</div>
        </div>
      </div>
      </div>
    </div>

    <div class="mark-row">
      <button class="mark-btn no" id="markNo">✗ Don't Know</button>
      <button class="mark-btn yes" id="markYes">✓ Know It</button>
    </div>

    <div class="nav">
      <button id="prevBtn" aria-label="Previous">←</button>
      <div class="counter" id="counter">1 / 72</div>
      <button id="nextBtn" aria-label="Next">→</button>
    </div>

    <div class="review-row">
      <button class="action-btn" id="reviewMissedBtn">Review Missed (0)</button>
      <button class="action-btn" id="resetScoreBtn">Reset Score</button>
    </div>

    <div class="footer-hint">tap card to flip · ← → to move · mark ✓/✗ to track progress</div>
  </div>

<script>
/* ---------- category metadata ---------- */
const CATS = {
  br:{label:'Bullish Reversal', short:'BULL · REV', trend:'down'},
  bc:{label:'Bullish Continuation', short:'BULL · CONT', trend:'up'},
  er:{label:'Bearish Reversal', short:'BEAR · REV', trend:'up'},
  ec:{label:'Bearish Continuation', short:'BEAR · CONT', trend:'down'},
};

/* ---------- helpers ---------- */
function P(name, cat, desc, candles){ return {name, cat, desc, candles}; }

// mirrors a pattern vertically (top<->bottom) and swaps bull/bear coloring,
// used for reversal/continuation pairs that are structurally identical mirror images
function M(p, cat, name, desc){
  return P(name || p.name, cat, desc || p.desc, p.candles.map(c => ({
    wT: 100 - c.wB, wB: 100 - c.wT,
    bT: 100 - c.bB, bB: 100 - c.bT,
    c: c.c === 'bull' ? 'bear' : (c.c === 'bear' ? 'bull' : 'neutral')
  })));
}

/* ================= BULLISH REVERSAL (base set) ================= */
const longWhiteBody = P("Long White Body","br","A single candle with a large green body and short wicks, showing buyers were in control from open to close with little resistance.",
  [{wT:18,wB:82,bT:20,bB:80,c:'bull'}]);

const hammer = P("Hammer","br","Forms after a decline. A small body sits near the top of the range with a long lower wick, showing sellers pushed price down but buyers drove it back up before the close.",
  [{wT:15,wB:90,bT:15,bB:32,c:'bull'}]);

const invHammer = P("Inverted Hammer","br","Appears after a downtrend. Small body near the bottom with a long upper wick — buyers tried to push higher and were pushed back, but the attempt hints demand is returning.",
  [{wT:10,wB:88,bT:70,bB:85,c:'bull'}]);

const beltHoldBull = P("Belt Hold (Bullish)","br","Opens at the low of the session and climbs steadily to close near the high, leaving little to no lower wick — a strong one-candle statement that buyers took control immediately.",
  [{wT:18,wB:85,bT:20,bB:85,c:'bull'}]);

const engulfBull = P("Engulfing Pattern (Bullish)","br","A small red candle is followed by a larger green candle whose body fully covers the prior one, signaling buyers overwhelming the previous selling pressure.",
  [{wT:30,wB:60,bT:35,bB:55,c:'bear'},{wT:15,wB:80,bT:20,bB:75,c:'bull'}]);

const haramiBull = P("Harami (Bullish)","br","A long red candle is followed by a small green candle whose body sits entirely inside the prior one, suggesting the downward momentum is stalling.",
  [{wT:10,wB:80,bT:15,bB:75,c:'bear'},{wT:38,wB:58,bT:40,bB:55,c:'bull'}]);

const haramiCrossBull = P("Harami Cross (Bullish)","br","Like a bullish harami, but the second candle is a doji — an even stronger sign of indecision breaking a prior downtrend's momentum.",
  [{wT:10,wB:80,bT:15,bB:75,c:'bear'},{wT:30,wB:65,bT:46,bB:49,c:'neutral'}]);

const piercing = P("Piercing Line","br","A long red candle is followed by a green candle that opens below the prior low but closes above its midpoint, showing a strong intraday reversal in buyers' favor.",
  [{wT:15,wB:75,bT:20,bB:70,c:'bear'},{wT:35,wB:90,bT:40,bB:85,c:'bull'}]);

const dojiStarBull = P("Doji Star (Bullish)","br","A long red candle is followed by a doji whose real body gaps below it, showing selling momentum has stalled completely — the shadows may still overlap; it's the bodies that need to gap.",
  [{wT:10,wB:70,bT:15,bB:65,c:'bear'},{wT:55,wB:85,bT:72,bB:75,c:'neutral'}]);

const meetingLinesBull = P("Meeting Lines (Bullish)","br","A long red candle is followed by a long green candle that closes at almost the same price, showing sellers and buyers 'meeting' at a level and momentum reversing.",
  [{wT:10,wB:65,bT:15,bB:60,c:'bear'},{wT:60,wB:95,bT:63,bB:92,c:'bull'}]);

const threeWhiteSoldiers = P("Three White Soldiers","br","Three consecutive green candles, each opening within the previous body and closing higher than the last — steady, sustained buying pressure over several sessions.",
  [{wT:55,wB:88,bT:60,bB:85,c:'bull'},{wT:35,wB:72,bT:40,bB:68,c:'bull'},{wT:15,wB:52,bT:20,bB:48,c:'bull'}]);

const morningStar = P("Morning Star","br","A long red candle, then a small-bodied candle that gaps lower, then a long green candle closing well into the first candle's body — a classic three-candle turning point.",
  [{wT:10,wB:65,bT:15,bB:60,c:'bear'},{wT:60,wB:80,bT:68,bB:72,c:'neutral'},{wT:15,wB:70,bT:20,bB:65,c:'bull'}]);

const morningDojiStar = P("Morning Doji Star","br","A variant of the Morning Star where the middle candle is a doji instead of a small body, showing an even sharper moment of indecision before buyers take over.",
  [{wT:10,wB:65,bT:15,bB:60,c:'bear'},{wT:65,wB:80,bT:71,bB:74,c:'neutral'},{wT:15,wB:70,bT:20,bB:65,c:'bull'}]);

const abandonedBabyBull = P("Abandoned Baby (Bullish)","br","A rare, powerful reversal: a long red candle, then a doji that gaps away from it with a visible price gap on both sides, then a green candle gapping back up — the doji looks 'abandoned' in space.",
  [{wT:10,wB:60,bT:15,bB:55,c:'bear'},{wT:63,wB:76,bT:68,bB:71,c:'neutral'},{wT:15,wB:60,bT:20,bB:55,c:'bull'}]);

const triStarBull = P("Tri-Star (Bullish)","br","Three consecutive doji candles, with the middle one's real body gapping below the other two — an extreme, rare moment of indecision at the bottom of a decline. As with any star pattern, it's the bodies that gap; the shadows commonly overlap.",
  [{wT:35,wB:70,bT:46,bB:49,c:'neutral'},{wT:40,wB:75,bT:54,bB:57,c:'neutral'},{wT:35,wB:70,bT:46,bB:49,c:'neutral'}]);

const breakawayBull = P("Breakaway (Bullish)","br","A five-candle pattern: a long red candle, three smaller candles continuing lower in steps, then a long green candle that closes back inside the first candle's body — a slow reversal.",
  [{wT:10,wB:40,bT:15,bB:35,c:'bear'},{wT:38,wB:60,bT:42,bB:57,c:'bear'},{wT:55,wB:75,bT:58,bB:72,c:'bear'},{wT:68,wB:88,bT:70,bB:85,c:'bear'},{wT:20,wB:90,bT:25,bB:85,c:'bull'}]);

const threeInsideUp = P("Three Inside Up","br","A Bullish Harami followed by a third green candle that closes above the second candle's high, confirming the reversal signaled by the harami.",
  [{wT:10,wB:80,bT:15,bB:75,c:'bear'},{wT:38,wB:58,bT:40,bB:55,c:'bull'},{wT:20,wB:52,bT:22,bB:48,c:'bull'}]);

const threeOutsideUp = P("Three Outside Up","br","A Bullish Engulfing pattern followed by a third green candle that closes even higher, confirming buyers have firmly taken control.",
  [{wT:30,wB:60,bT:35,bB:55,c:'bear'},{wT:15,wB:80,bT:20,bB:75,c:'bull'},{wT:8,wB:72,bT:10,bB:68,c:'bull'}]);

const kickingBull = P("Kicking (Bullish)","br","A bearish marubozu is immediately followed by a bullish marubozu that gaps up with no overlap in price range at all — an abrupt, forceful reversal in sentiment.",
  [{wT:40,wB:42,bT:42,bB:90,c:'bear'},{wT:5,wB:8,bT:8,bB:37,c:'bull'}]);

const uniqueThreeRivers = P("Unique Three Rivers Bottom","br","A long red candle, then a smaller red candle with a lower low forming a hammer-like shape inside the first's range, then a small green candle — a gradual bottoming process.",
  [{wT:10,wB:70,bT:15,bB:65,c:'bear'},{wT:60,wB:95,bT:60,bB:80,c:'bear'},{wT:55,wB:78,bT:60,bB:74,c:'bull'}]);

const threeStarsSouth = P("Three Stars in the South","br","Three small red candles with progressively shrinking ranges, showing selling pressure steadily running out of steam near a bottom.",
  [{wT:10,wB:60,bT:15,bB:55,c:'bear'},{wT:35,wB:70,bT:40,bB:63,c:'bear'},{wT:50,wB:72,bT:53,bB:68,c:'bear'}]);

const concealingSwallow = P("Concealing Baby Swallow","br","A rare four-part bottoming pattern: two black marubozu candles followed by a candle that gaps down but whose wick 'conceals' back into the prior range, then a candle that fully engulfs the move — signaling exhaustion of a decline.",
  [{wT:20,wB:22,bT:22,bB:70,c:'bear'},{wT:65,wB:67,bT:67,bB:92,c:'bear'},{wT:10,wB:95,bT:15,bB:90,c:'bear'}]);

const stickSandwich = P("Stick Sandwich","br","A red candle, then a green candle closing higher, then another red candle closing at nearly the same price as the first — the green candle is 'sandwiched' between two matching closes.",

function categoryList(){

function currentList(){

  if(reviewMode) list = list.filter(i => scores[i] === 'unknown');

function updateScoreBar(){
  const catList = categoryList();
  const known = catList.filter(i => scores[i] === 'known').length;
  const missed = catList.filter(i => scores[i] === 'unknown').length;
  const total = catList.length;

  document.getElementById('knownCount').textContent = known;
  document.getElementById('reviewCount').textContent = missed;
  document.getElementById('remainingCount').textContent = (total - known - missed) + ' left';
  document.getElementById('progressFill').style.width = total ? ((known + missed) / total * 100) + '%' : '0%';

  const rb = document.getElementById('reviewMissedBtn');
  rb.textContent = reviewMode ? 'Exit Review Mode' : `Review Missed (${missed})`;
  rb.disabled = !reviewMode && missed === 0;
  rb.classList.toggle('on', reviewMode);
}

function drawChart(container, candles, trendDir){
  container.innerHTML = '';

  // lead-in: 3 faded candlesticks showing the prior trend
  const lead = document.createElement('div');
  lead.className = 'lead-zone';
  const leadShapes = trendDir === 'up'
    ? [{wT:70,wB:96,bT:76,bB:93,c:'bull'},{wT:45,wB:76,bT:50,bB:73,c:'bull'},{wT:14,wB:52,bT:20,bB:48,c:'bull'}]
    : [{wT:14,wB:52,bT:20,bB:48,c:'bear'},{wT:45,wB:76,bT:50,bB:73,c:'bear'},{wT:70,wB:96,bT:76,bB:93,c:'bear'}];
  const ln = leadShapes.length;
  leadShapes.forEach((cd, i) => {
    const slot = document.createElement('div');
    slot.className = 'lead-candle';
    const leftPct = ((i+0.5)/ln)*100;
    slot.style.left = `calc(${leftPct}% - 6%)`;
    slot.style.width = (60/ln) + '%';

    const wick = document.createElement('div');
    wick.className = 'wick';
    wick.style.top = cd.wT + '%';
    wick.style.height = (cd.wB - cd.wT) + '%';
    wick.style.background = cd.c === 'bull' ? 'var(--bull)' : 'var(--bear)';

    const body = document.createElement('div');
    body.className = 'body';
    body.style.top = cd.bT + '%';
    body.style.height = Math.max(cd.bB - cd.bT, 2) + '%';
    body.style.background = cd.c === 'bull' ? 'var(--bull)' : 'var(--bear)';

    slot.appendChild(wick);
    slot.appendChild(body);
    lead.appendChild(slot);
  });
  container.appendChild(lead);

  // pattern candles
  const zone = document.createElement('div');
  zone.className = 'pattern-zone';
  const n = candles.length;
  candles.forEach((cd, i) => {
    const slot = document.createElement('div');
    slot.className = 'candle';
    const leftPct = ((i+0.5)/n)*100;
    slot.style.left = `calc(${leftPct}% - 7%)`;
    slot.style.width = (70/n) + '%';

    const wick = document.createElement('div');
    wick.className = 'wick';
    wick.style.top = cd.wT + '%';
    wick.style.height = (cd.wB - cd.wT) + '%';

    const body = document.createElement('div');
    body.className = 'body ' + cd.c;
    body.style.top = cd.bT + '%';
    body.style.height = Math.max(cd.bB - cd.bT, 2) + '%';

    slot.appendChild(wick);
    slot.appendChild(body);
    zone.appendChild(slot);
  });
  container.appendChild(zone);
}

function render(){
  const list = currentList();
  const counterEl = document.getElementById('counter');

  updateScoreBar();

  if(list.length === 0){
    const msg = reviewMode
      ? '🎉 All caught up!<br>No cards left to review.'
      : 'No categories selected.<br>Toggle at least one above.';
    document.querySelector('.stage').innerHTML = `<div class="empty-msg">${msg}</div>`;
    counterEl.textContent = '0 / 0';
    return;
  }
  ensureStage();
  if(idx >= list.length) idx = 0;

  const realIdx = list[idx];
  const p = PATTERNS[realIdx];
  const meta = CATS[p.cat];
  const posLabel = String(idx+1).padStart(2,'0');
  const status = scores[realIdx];

  document.getElementById('frontIndex').textContent = posLabel;
  document.getElementById('backIndex').textContent = posLabel;
  document.getElementById('backName').textContent = p.name;
  document.getElementById('backDesc').textContent = p.desc;
  document.getElementById('frontTrend').textContent = 'PRIOR TREND: ' + meta.trend.toUpperCase();

  const badge = document.getElementById('frontBadge');
  badge.textContent = status === 'known' ? '✓' : status === 'unknown' ? '✗' : '';
  badge.style.color = status === 'known' ? 'var(--bull)' : status === 'unknown' ? 'var(--bear)' : 'var(--muted)';

  document.getElementById('backTag').textContent = meta.short;
  document.getElementById('backTag').className = 'tag ' + p.cat;

  drawChart(document.getElementById('chartFront'), p.candles, meta.trend);
  counter.textContent = `${idx+1} / ${list.length}`;

  const cardEl = document.getElementById('card');
  cardEl.style.transition = 'none';
  cardEl.classList.remove('flipped');
  void cardEl.offsetWidth; // force reflow so the transition-none takes effect immediately
  cardEl.style.transition = '';
  flipped = false;
}

function ensureStage(){
  if(!document.getElementById('card')){
    document.querySelector('.stage').innerHTML = `
      <div class="slide-wrap" id="slideWrap">
      <div class="card" id="card">
        <div class="face front">
          <div class="card-top"><span id="frontIndex">01</span><span class="status-badge" id="frontBadge"></span></div>
          <div class="trend-label" id="frontTrend">PRIOR TREND: DOWN</div>
          <div class="chart" id="chartFront"></div>
          <div class="hint">tap to reveal &middot; swipe for next</div>
        </div>
        <div class="face back">
          <div class="card-top"><span id="backIndex">01</span><span class="tag" id="backTag">BULL · REV</span></div>
          <div class="name" id="backName">Hammer</div>
          <div class="desc" id="backDesc">...</div>
        </div>
      </div>
      </div>`;
    attachCardListener();
  }
}

function attachCardListener(){
  const c = document.getElementById('card');
  c.addEventListener('click', () => {
    flipped = !flipped;
    document.getElementById('card').classList.toggle('flipped', flipped);
  });

  let startX = 0, startY = 0, startTime = 0, tracking = false;
  c.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    startX = t.clientX; startY = t.clientY; startTime = Date.now();
    tracking = true;
  }, {passive:true});

  c.addEventListener('touchend', (e) => {
    if(!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const dt = Date.now() - startTime;
    const isSwipe = Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3 && dt < 700;
    if(isSwipe){
      e.preventDefault();
      if(dx < 0) document.getElementById('nextBtn').click();
      else document.getElementById('prevBtn').click();
    }
    // otherwise, let the normal click event handle the flip
  }, {passive:false});
}
attachCardListener();

function animateSlide(direction, updateFn){
  const wrap = document.getElementById('slideWrap');
  if(!wrap){ updateFn(); return; }
  const outX = direction === 'next' ? '-28%' : '28%';
  const inX = direction === 'next' ? '28%' : '-28%';

  wrap.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
  wrap.style.transform = `translateX(${outX})`;
  wrap.style.opacity = '0';

  setTimeout(() => {
    updateFn();
    wrap.style.transition = 'none';
    wrap.style.transform = `translateX(${inX})`;
    void wrap.offsetWidth; // force reflow
    requestAnimationFrame(() => {
      wrap.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
      wrap.style.transform = 'translateX(0)';
      wrap.style.opacity = '1';
    });
  }, 200);
}

document.getElementById('prevBtn').addEventListener('click', () => {
  ensureStage();
  const list = currentList();
  if(list.length === 0) return;
  animateSlide('prev', () => {
    idx = (idx - 1 + list.length) % list.length;
    render();
  });
});
document.getElementById('nextBtn').addEventListener('click', () => {
  ensureStage();
  const list = currentList();
  if(list.length === 0) return;
  animateSlide('next', () => {
    idx = (idx + 1) % list.length;
    render();
  });
});

function updateDeckCount(){
  const n = PATTERNS.filter(p => activeCats.has(p.cat)).length;
  document.getElementById('deckCount').textContent = `${n} card${n===1?'':'s'} selected`;
  document.getElementById('startBtn').disabled = n === 0;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const c = btn.dataset.c;
    if(activeCats.has(c)){
      activeCats.delete(c);
      btn.classList.remove('on');
    } else {
      activeCats.add(c);
      btn.classList.add('on');
    }
    updateDeckCount();
  });
});

document.getElementById('allBtn').addEventListener('click', () => {
  activeCats = new Set(['br','bc','er','ec']);
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.add('on'));
  updateDeckCount();
});
document.getElementById('noneBtn').addEventListener('click', () => {
  activeCats = new Set();
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
  updateDeckCount();
});
document.getElementById('shuffleBtn').addEventListener('click', () => {
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0;
  ensureStage();
  render();
});

function showHome(){
  document.getElementById('studyView').style.display = 'none';
  document.getElementById('homeView').style.display = 'flex';
}
function showStudy(){
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('studyView').style.display = 'flex';
  idx = 0;
  ensureStage();
  render();
}
document.getElementById('startBtn').addEventListener('click', showStudy);
document.getElementById('backBtn').addEventListener('click', showHome);

updateDeckCount();

function markCard(status){
  const list = currentList();
  if(list.length === 0) return;
  if(idx >= list.length) idx = 0;
  const realIdx = list[idx];
  scores[realIdx] = status;

  const newList = currentList();
  if(newList.length === 0){
    render();
    return;
  }
  const pos = newList.indexOf(realIdx);
  animateSlide('next', () => {
    idx = pos === -1 ? Math.min(idx, newList.length - 1) : (pos + 1) % newList.length;
    ensureStage();
    render();
  });
}
document.getElementById('markNo').addEventListener('click', () => markCard('unknown'));
document.getElementById('markYes').addEventListener('click', () => markCard('known'));

document.getElementById('reviewMissedBtn').addEventListener('click', () => {
  if(reviewMode){
    reviewMode = false;
  } else {
    const missed = categoryList().filter(i => scores[i] === 'unknown');
    if(missed.length === 0) return;
    reviewMode = true;
  }
  idx = 0;
  ensureStage();
  render();
});

document.getElementById('resetScoreBtn').addEventListener('click', () => {
  scores = {};
  reviewMode = false;
  idx = 0;
  ensureStage();
  render();
});

window.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if(e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    const c = document.getElementById('card');
    if(c) c.click();
  }
});

ensureStage();
</script>
</body>
</html>
